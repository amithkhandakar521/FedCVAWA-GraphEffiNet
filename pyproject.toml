[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fedcvawa-grapheffinet"
version = "1.0.0"
description = "GraphEffiNet classifier and FedCVAWA aggregation for privacy-aware road condition monitoring"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Amith Khandakar", email = "amitk@qu.edu.qa" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "pyyaml>=6.0",
]
keywords = [
    "federated learning",
    "road condition monitoring",
    "graph neural networks",
    "efficientnet",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.setuptools]
packages = ["grapheffinet", "fedcvawa"]
